<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brazil Boogie, trip dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@300;400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Design system measured from freely.me/au/travel-insurance.
   Type: Freely (licensed) stands in as Nunito, body is Golos Text as on the reference. */
:root{--navy:#131E29;--slate:#3E5366;--slate-2:#506D85;--muted:#667382;
  --mint:#CBFFE9;--mint-2:#AAFFDE;--mint-3:#E9FFF7;--grey:#D8DCD8;--grey-2:#F6F7F6;--line:#B6BDB6}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--navy);
  font:400 18px/24px 'Golos Text',-apple-system,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:'Nunito','Golos Text',sans-serif;font-weight:800;letter-spacing:-.01em}
a{color:var(--slate);text-decoration:underline;text-underline-offset:3px}
.wrap{max-width:1312px;margin:0 auto;padding:0 32px}
.top{background:#fff;border-bottom:1px solid var(--grey);position:sticky;top:0;z-index:10}
.top__in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 16px}
.mark{font-family:'Nunito',sans-serif;font-weight:800;font-size:24px;color:var(--navy);text-decoration:none}
.dates{font-size:14px;line-height:20px;color:var(--slate)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 16px}
.tab{font:400 16px/1 'Golos Text',sans-serif;color:var(--navy);background:#fff;
  padding:12px 24px;border:1px solid var(--line);border-radius:100px;cursor:pointer;transition:all .2s ease}
.tab:hover{background:var(--mint-3)}
.tab[aria-selected="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
main{padding:72px 0 110px}
.view{display:none} .view.is-on{display:block}
.eyebrow{display:inline-block;font-size:14px;line-height:20px;letter-spacing:2.8px;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--muted);padding-bottom:10px;margin:0 0 28px}
.hero{text-align:center}
.hero h1{font-size:64px;line-height:70px;margin-bottom:16px}
.hero p{max-width:640px;margin:0 auto 56px;color:var(--slate)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;text-align:left}
.card{text-align:left;border:0;border-radius:24px;background:var(--grey-2);padding:36px 32px 32px;cursor:pointer;
  font-family:inherit;transition:transform .2s ease}
.card:nth-child(2){background:var(--mint)} .card:nth-child(4){background:var(--grey)}
.card:hover{transform:translateY(-3px)}
.card h3{font-size:28px;line-height:34px;margin-bottom:8px}
.card p{margin:0;font-size:16px;line-height:22px;color:var(--slate)}
h2.section{font-size:44px;line-height:52px;text-align:center;margin-bottom:48px}
.house{border:1px solid var(--line);border-radius:16px;padding:36px 32px;margin-bottom:24px}
.house h3{font-size:36px;line-height:44px}
.house__meta{margin:6px 0 28px;font-size:16px;line-height:22px;color:var(--slate-2)}
.facts{margin:26px 0 30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px 32px}
.fact dt{font-size:12px;line-height:16px;font-weight:300;color:var(--slate-2);margin-bottom:4px}
.fact dd{margin:0;font-size:18px;line-height:24px}
.rooms--top{border-top:0 !important;padding-top:0 !important}
.beds{display:block;font-size:13px;line-height:19px;color:var(--slate-2);margin:-6px 0 8px}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;
  border-top:1px solid var(--grey);padding-top:28px}
.room{background:var(--grey-2);border-radius:16px;padding:20px 22px}
.room h4{font-family:'Golos Text',sans-serif;font-weight:500;font-size:16px;line-height:22px;margin-bottom:10px}
.room ul{margin:0;padding:0;list-style:none;font-size:16px;line-height:24px}
.room li{padding:2px 0}
.room li.empty{color:var(--slate-2)}
.gap{display:inline-block;background:var(--mint);border-radius:100px;padding:2px 10px;font-size:13px;line-height:19px;color:var(--navy)}
.links{margin:26px 0 0} .links a{margin-right:24px;font-size:16px}
.tbl{border:1px solid var(--line);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:16px;line-height:22px}
th{text-align:left;font-family:'Golos Text',sans-serif;font-weight:500;font-size:14px;line-height:20px;
  color:var(--slate-2);padding:16px 20px;background:var(--grey-2);border-bottom:1px solid var(--grey)}
td{padding:16px 20px;border-bottom:1px solid var(--grey);vertical-align:top}
tr:last-child td{border-bottom:0}
.todo{margin:0;padding:0;list-style:none}
.todo li{background:var(--grey-2);border-radius:16px;padding:22px 26px;margin-bottom:12px}
.todo li:nth-child(odd){background:var(--mint-3)}
.scroll{overflow-x:auto}
@media(max-width:700px){
  .wrap{padding:0 20px} main{padding:44px 0 80px}
  .hero h1{font-size:40px;line-height:46px} h2.section{font-size:32px;line-height:38px}
  .house{padding:26px 22px} .house__head h3{font-size:28px;line-height:34px}
  td,th{padding:13px 14px}
}
</style>
<style>
.loading{text-align:center;color:var(--slate-2);padding:80px 0}
.err{background:var(--mint);border-radius:16px;padding:22px 26px;text-align:center}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top__in">
      <a class="mark" href="#" data-go="home">Brazil Boogie</a>
      <span class="dates">B&uacute;zios, Brazil &middot; 12 to 19 October 2026</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-go="home" aria-selected="true">Home</button>
      <button class="tab" role="tab" data-go="houses" aria-selected="false">Houses and rooms</button>
      <button class="tab" role="tab" data-go="guests" aria-selected="false">Guests</button>
      <button class="tab" role="tab" data-go="expenses" aria-selected="false">Expenses sheet</button>
      <button class="tab" role="tab" data-go="open" aria-selected="false">Open items</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view is-on hero" id="home">
    <h1>B&uacute;zios, 12 to 19 October</h1>
    <div class="cards">
      <button class="card" data-go="houses"><h3>Houses and rooms</h3></button>
      <button class="card" data-go="guests"><h3>Guests</h3></button>
      <button class="card" data-go="expenses"><h3>Expenses sheet</h3></button>
      <button class="card" data-go="open"><h3>Open items</h3></button>
    </div>
  </section>

  <section class="view" id="houses"><h2 class="section">Houses and rooms</h2><div id="housesBody" class="loading">Loading</div></section>
  <section class="view" id="guests"><h2 class="section">Guests</h2><div id="guestsBody" class="loading">Loading</div></section>
  <section class="view" id="expenses"><h2 class="section">Expenses sheet</h2><div id="expensesBody" class="loading">Loading</div></section>
  <section class="view" id="open"><h2 class="section">Open items</h2><div id="openBody" class="loading">Loading</div></section>
</main>

<script>
var SHEET = '124qYeXChXvuWnJJfFZMZBFme2DhNZQAgZ9DjD6Eal28';
var TABS = { rooms: 'Rooms', guests: 'Guests', expenses: 'Expenses sheet', open: 'Open items' };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }

function parseCSV(text){
  var rows = [], row = [], field = '', q = false, i = 0;
  while (i < text.length) {
    var c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i += 2; continue; }
      if (c === '"') { q = false; i++; continue; }
      field += c; i++; continue;
    }
    if (c === '"') { q = true; i++; continue; }
    if (c === ',') { row.push(field); field = ''; i++; continue; }
    if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = ''; i++; continue;
    }
    field += c; i++;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  var head = rows.shift().map(function(h){ return h.trim(); });
  return rows.filter(function(r){ return r.some(function(c){ return c.trim(); }); })
             .map(function(r){ var o = {}; head.forEach(function(h, n){ o[h] = (r[n] || '').trim(); }); return o; });
}

function load(tab){
  var url = 'https://docs.google.com/spreadsheets/d/' + SHEET +
            '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(TABS[tab]) + '&_=' + Date.now();
  return fetch(url).then(function(r){
    if (!r.ok) throw new Error(r.status);
    return r.text();
  }).then(parseCSV);
}

var NOEMAIL = ' <span class="gap">no email</span>';

function renderHouses(rooms, guests){
  var order = [], seen = {};
  rooms.forEach(function(r){ if (!seen[r.house]) { seen[r.house] = 1; order.push(r); } });
  return order.map(function(h){
    var mine = rooms.filter(function(r){ return r.house === h.house; });
    var names = {};
    mine.forEach(function(r){ names[r.room] = 1; });
    var blocks = mine.map(function(r){
      var who = guests.filter(function(g){ return g.house === r.house && g.room === r.room && g.name; });
      var list = who.length
        ? who.map(function(g){ return '<li>' + esc(g.name) + (g.email ? '' : NOEMAIL) + '</li>'; }).join('')
        : '<li class="empty">Empty</li>';
      var beds = r.beds ? '<span class="beds">' + esc(r.beds) + '</span>' : '';
      return '<div class="room"><h4>' + esc(r.room) + '</h4>' + beds + '<ul>' + list + '</ul></div>';
    }).join('');
    var spare = guests.filter(function(g){ return g.house === h.house && g.name && !names[g.room]; });
    if (spare.length) {
      blocks += '<div class="room"><h4>No room yet</h4><ul>' + spare.map(function(g){
        return '<li>' + esc(g.name) + (g.email ? '' : NOEMAIL) + '</li>'; }).join('') + '</ul></div>';
    }
    return '<article class="house"><p class="eyebrow">House ' + esc(h.house) + ', ' + esc(h.nickname) +
           '</p><h3>' + esc(h.house_name) + '</h3><div class="rooms rooms--top">' + blocks + '</div></article>';
  }).join('');
}

function table(head, rows){
  return '<div class="scroll"><div class="tbl"><table><thead><tr>' +
    head.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('') +
    '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}

function renderGuests(guests){
  var rows = guests.slice().sort(function(a, b){
    return (a.house + a.name).localeCompare(b.house + b.name); }).map(function(g){
    var em = g.email ? '<a href="mailto:' + esc(g.email) + '">' + esc(g.email) + '</a>'
                     : '<span class="gap">missing</span>';
    var ph = g.phone ? esc(g.phone) : '<span class="gap">missing</span>';
    var ig = g.instagram ? '<a href="https://instagram.com/' + esc(g.instagram) +
             '" target="_blank" rel="noopener">@' + esc(g.instagram) + '</a>' : '';
    return '<tr><td>' + esc(g.name) + '</td><td>' + esc(g.house) + '</td><td>' + esc(g.room) +
           '</td><td>' + em + '</td><td>' + ph + '</td><td>' + ig + '</td></tr>';
  }).join('');
  return table(['Name', 'House', 'Room', 'Email', 'Phone', 'Instagram'], rows);
}

function renderExpenses(costs){
  var rows = costs.map(function(c){
    var amt = c.amount ? esc(c.amount) : '<span class="gap">to come</span>';
    return '<tr><td>' + esc(c.what) + '</td><td>' + amt + '</td><td>' + esc(c.paid_by) +
           '</td><td>' + esc(c.status) + '</td><td>' + esc(c.notes) + '</td></tr>';
  }).join('');
  return table(['What', 'Amount', 'Paid by', 'Status', 'Notes'], rows);
}

function renderOpen(items){
  return '<ul class="todo">' + items.filter(function(i){ return (i.status || 'open') !== 'done'; })
    .map(function(i){ return '<li>' + esc(i.item) + '</li>'; }).join('') + '</ul>';
}

function fail(el){ el.className = 'err'; el.textContent = 'Could not reach the sheet. Refresh in a moment.'; }

Promise.all([load('rooms'), load('guests'), load('expenses'), load('open')]).then(function(d){
  document.getElementById('housesBody').className = '';
  document.getElementById('housesBody').innerHTML = renderHouses(d[0], d[1]);
  document.getElementById('guestsBody').className = '';
  document.getElementById('guestsBody').innerHTML = renderGuests(d[1]);
  document.getElementById('expensesBody').className = '';
  document.getElementById('expensesBody').innerHTML = renderExpenses(d[2]);
  document.getElementById('openBody').className = '';
  document.getElementById('openBody').innerHTML = renderOpen(d[3]);
}).catch(function(){
  ['housesBody', 'guestsBody', 'expensesBody', 'openBody'].forEach(function(id){
    fail(document.getElementById(id)); });
});

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-go]');
  if (!el) return;
  ev.preventDefault();
  var id = el.getAttribute('data-go');
  document.querySelectorAll('.view').forEach(function (v) { v.classList.toggle('is-on', v.id === id); });
  document.querySelectorAll('.tab').forEach(function (t) {
    t.setAttribute('aria-selected', String(t.getAttribute('data-go') === id)); });
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
</body>
</html>
